name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project with custom files
        run: |
          rm -rf android
          npx cap add android

          SRC=android/app/src/main
          mkdir -p $SRC/java/com/beneficiaries/sender $SRC/res/xml
          cp custom-android/AndroidManifest.xml $SRC/AndroidManifest.xml
          cp custom-android/java/*.java $SRC/java/com/beneficiaries/sender/
          cp custom-android/res/xml/*.xml $SRC/res/xml/

          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
