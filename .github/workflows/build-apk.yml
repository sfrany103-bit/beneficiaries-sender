name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project with custom files
        run: |
          mkdir -p /tmp/custom_android/java
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/custom_android/AndroidManifest.xml
          fi
          find android -name "*.java" -exec cp {} /tmp/custom_android/java/ \; 2>/dev/null || true

          rm -rf android
          npx cap add android

          mkdir -p android/app/src/main/java/com/beneficiaries/sender
          if [ -f "/tmp/custom_android/AndroidManifest.xml" ]; then
            cp /tmp/custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "/tmp/custom_android/java/MainActivity.java" ]; then
            cp /tmp/custom_android/java/MainActivity.java android/app/src/main/java/com/beneficiaries/sender/MainActivity.java
          fi
          if [ -f "/tmp/custom_android/java/SmsSenderPlugin.java" ]; then
            cp /tmp/custom_android/java/SmsSenderPlugin.java android/app/src/main/java/com/beneficiaries/sender/SmsSenderPlugin.java
          fi

          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
