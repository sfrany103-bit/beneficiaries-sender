name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Add file save and share plugins
        run: |
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capacitor/filesystem@^$MAJOR" "@capacitor/share@^$MAJOR"

      - name: Bundle XLSX library locally
        run: |
          npm install xlsx@0.18.5 --no-save
          cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Prepare Android project with custom files
        run: |
          rm -rf android
          npx cap add android

          SRC=android/app/src/main
          mkdir -p $SRC/java/com/beneficiaries/sender $SRC/res/xml
          cp custom-android/AndroidManifest.xml $SRC/AndroidManifest.xml
          cp custom-android/java/*.java $SRC/java/com/beneficiaries/sender/
          cp custom-android/res/xml/*.xml $SRC/res/xml/

          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with fixed key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias sender \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out beneficiaries-sender.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs beneficiaries-sender.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beneficiaries-sender-apk
          path: beneficiaries-sender.apk
